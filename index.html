*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#eef7ff,#fff5df);
  color:#17365d;
  min-height:100vh;
}

.wrap{
  max-width:760px;
  margin:auto;
  padding:7px;
}

.logo{
  text-align:center;
  font-size:36px;
  font-weight:900;
}

  color:#ff9f1c;
}

.slogan{
  text-align:center;
  color:#718096;
  font-weight:700;
  font-size:13px;
  margin:3px 0 8px;
}

.card{
  background:#fff;
  border-radius:24px;
  padding:14px;
  box-shadow:0 12px 35px rgba(23,54,93,.12);
}

.center{text-align:center}
.hidden{display:none!important}

.levels{
  display:grid;
  gap:7px;
  margin:12px 0;
}

button{
  border:0;
  border-radius:15px;
  padding:10px;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  font-family:Arial,sans-serif;
}

.level{
  background:#eef6ff;
  color:#17365d;
  border:2px solid transparent;
}

.level.active{
  background:#fff7e8;
  border-color:#ff9f1c;
}

.primary{
  width:100%;
  background:#2f80ed;
  color:white;
}

.secondary{
  background:#eef6ff;
  color:#17365d;
}

.mistakes{
  width:100%;
  margin-top:7px;
  background:#fff4df;
  color:#805400;
}

.top,
.stats{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:6px;
}

.badge{
  background:#fff4df;
  padding:7px 10px;
  border-radius:30px;
  font-weight:800;
}

.progress{
  height:8px;
  background:#e9eff5;
  border-radius:20px;
  overflow:hidden;
  margin:6px 0;
}

.bar{
  height:100%;
  background:#ff9f1c;
  width:0;
}

.stats{
  font-size:13px;
  color:#65758b;
  font-weight:700;
}

.instruction{
  text-align:center;
  color:#65758b;
  font-weight:800;
  font-size:16px;
  margin-top:7px;
}

.question{
  text-align:center;
  font-size:26px;
  font-weight:900;
  margin:8px 0;
  line-height:1.25;
}

.answers{
  display:grid;
  gap:6px;
}

.answer{
  background:#fff;
  border:2px solid #dce7f2;
  color:#17365d;
  padding:9px;
  line-height:1.3;
}

.answer:hover{
  border-color:#2f80ed;
  background:#f5f9ff;
}

.answer:disabled{
  cursor:default;
}

.feedback{
  margin-top:6px;
  padding:7px 9px;
  border-radius:12px;
  font-size:14px;
}

.good{
  background:#e9f8ef;
  color:#176b46;
}

.bad{
  background:#fff0f2;
  color:#9f3047;
}

#nextButton{
  margin-top:6px;
  padding:8px;
}

.score{
  font-size:48px;
  font-weight:900;
}

.footer{
  text-align:center;
  color:#8795a7;
  font-size:12px;
  margin-top:5px;
}

function shuffle(array){

  const a=[...array];

  for(let i=a.length-1;i>0;i--){

    const j=
      Math.floor(
        Math.random()*(i+1)
      );

    [a[i],a[j]]=
    [a[j],a[i]];
  }

  return a;
}

}

  }
}


function setMistakes(data){

  localStorage.setItem(
    "damtoDruhyVietV1",
    JSON.stringify(data)
  );

  updateMistakeCount();
}


function updateMistakeCount(){

  const count=
    Object.keys(
      getMistakes()

  const mistakes=
    getMistakes();

  const list=
    source();

  questions=[

    ...shuffle(
      list.filter(
        x=>mistakes[x.id]
      )
    ),

    ...shuffle(
      list.filter(
        x=>!mistakes[x.id]
      )
    )

  ].slice(0,10);

  current=0;
  score=0;

  show("game");

  render();
}

  if(!all.length){

    alert(
      "🎉 Nemáš žiadne chyby na precvičenie."
    );

    return;
  }

  questions=
    shuffle(all)
    .slice(0,10);

  current=0;
  score=0;

  show("game");

  render();
}


/* =====================================================
   ZOBRAZENIE OTÁZKY
===================================================== */

function render(){

  locked=false;

  if(current>=questions.length){

    finish();
    return;
  }

  const x=
    questions[current];

  $("counter")
  .textContent=
    (current+1)
    +" / "+
    questions.length;

  $("points")
  .textContent=
    score;

  $("bar")
  .style.width=
    (
      current /
      questions.length *
      100
    )+"%";

  $("levelBadge")
  .textContent=

    selectedLevel===1

    ? "⭐ Skúšam"

    : selectedLevel===2

    ? "⭐⭐ Už mi to ide"

    : "⭐⭐⭐ DámTo!";

  $("instruction")
  .textContent=
    x.i;

  $("question")
  .textContent=
    x.q || "";

  $("feedback")
  .innerHTML="";

  $("feedback")
  .className="";

  $("nextButton")
  .classList
  .add("hidden");

  const box=
    $("answers");

  box.innerHTML="";

  shuffle(x.o)
  .forEach(
    option=>{

      const button=
        document
        .createElement("button");

      button.className=
        "answer";

      button.textContent=
        option;

      button.addEventListener(
        "click",
        ()=>checkAnswer(
          option===x.c
        )
      );

      box.appendChild(
        button
      );
    }
  );
}


/* =====================================================
   KONTROLA ODPOVEDE
===================================================== */

function checkAnswer(ok){

  if(locked){
    return;
  }

  locked=true;

  const x=
    questions[current];

  const mistakes=
    getMistakes();

  const feedback=
    $("feedback");

  if(ok){

    score++;

    delete mistakes[x.id];

    feedback.className=
      "feedback good";

    feedback.innerHTML=
      "🎉 <b>Výborne!</b> Správna odpoveď.";

  }else{

    mistakes[x.id]=true;

    feedback.className=
      "feedback bad";

    feedback.innerHTML=
      "❌ <b>Nesprávne.</b> Správna odpoveď je <b>"
      +x.c+
      "</b>.";
  }

  setMistakes(
    mistakes
  );

  $("points")
  .textContent=
    score;

  document
  .querySelectorAll(".answer")
  .forEach(
    button=>
      button.disabled=true
  );

  $("nextButton")
  .classList
  .remove("hidden");
}


/* =====================================================
   ĎALŠIA OTÁZKA
===================================================== */

function nextQuestion(){

  current++;

  render();

  window.scrollTo(0,0);
}


/* =====================================================
   ENTER = ĎALEJ
===================================================== */

document
.addEventListener(
  "keydown",
  event=>{

    if(
      event.key==="Enter" &&
      !$("game")
      .classList
      .contains("hidden") &&
      !$("nextButton")
      .classList
      .contains("hidden")
    ){

      event.preventDefault();

      nextQuestion();
    }
  }
);


/* =====================================================
   KONIEC
===================================================== */

function finish(){

  $("finalScore")
  .textContent=
    score+
    " / "+
    questions.length;

  const percent=
    questions.length

    ? score/questions.length

    : 0;

  $("finalMessage")
  .textContent=

    percent===1

    ? "Perfektné! Bez chyby. 🌟"

    : percent>=0.8

    ? "Výborne! 🚀"

    : percent>=0.6

    ? "Pekná práca. 💪"

    : "Skús ešte jeden tréning. 🌱";

  updateMistakeCount();

  show("finish");
}


/* =====================================================
   ŠTART
===================================================== */

updateMistakeCount();

</script>

</body>
</html>
