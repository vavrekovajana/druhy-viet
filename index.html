<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DámTo! – Druhy viet</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#eef7ff,#fff5df);
  color:#17365d;
  min-height:100vh;
}

.wrap{
  max-width:760px;
  margin:auto;
  padding:5px;
}

.logo{
  text-align:center;
  font-size:30px;
  font-weight:900;
  line-height:1;
}

.logo span{
  color:#ff9f1c;
}

.slogan{
  text-align:center;
  color:#718096;
  font-weight:700;
  font-size:11px;
  margin:2px 0 5px;
}

.card{
  background:#fff;
  border-radius:20px;
  padding:10px;
  box-shadow:0 10px 28px rgba(23,54,93,.12);
}

.center{
  text-align:center;
}

.hidden{
  display:none!important;
}

.levels{
  display:grid;
  gap:5px;
  margin:8px 0;
}

button{
  border:0;
  border-radius:13px;
  padding:8px;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
  font-family:Arial,sans-serif;
}

.level{
  background:#eef6ff;
  color:#17365d;
  border:2px solid transparent;
}

.level.active{
  background:#fff7e8;
  border-color:#ff9f1c;
}

.primary{
  width:100%;
  background:#2f80ed;
  color:white;
}

.secondary{
  background:#eef6ff;
  color:#17365d;
}

.mistakes{
  width:100%;
  margin-top:5px;
  background:#fff4df;
  color:#805400;
}

.allExercises{
  background:#fff4df;
  color:#805400;
}

.allExercisesHome{
  width:100%;
  margin-top:5px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:5px;
}

.navButtons{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

.badge{
  background:#fff4df;
  padding:6px 9px;
  border-radius:30px;
  font-weight:800;
  font-size:12px;
}

.progress{
  height:6px;
  background:#e9eff5;
  border-radius:20px;
  overflow:hidden;
  margin:5px 0;
}

.bar{
  height:100%;
  background:#ff9f1c;
  width:0;
}

.stats{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:5px;
  font-size:12px;
  color:#65758b;
  font-weight:700;
}

.instruction{
  text-align:center;
  color:#65758b;
  font-weight:800;
  font-size:14px;
  margin-top:5px;
}

.question{
  text-align:center;
  font-size:24px;
  font-weight:900;
  margin:6px 0;
  line-height:1.2;
}

.answers{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:5px;
}

.answer{
  background:#fff;
  border:2px solid #dce7f2;
  color:#17365d;
  padding:7px;
  line-height:1.25;
}

.answer:hover{
  border-color:#2f80ed;
  background:#f5f9ff;
}

.answer.keyboardSelected{
  border-color:#2f80ed;
  background:#eaf3ff;
  box-shadow:0 0 0 2px rgba(47,128,237,.12);
}

.answer:disabled{
  cursor:default;
}

.feedback{
  margin-top:5px;
  padding:5px 7px;
  border-radius:10px;
  font-size:12px;
}

.good{
  background:#e9f8ef;
  color:#176b46;
}

.bad{
  background:#fff0f2;
  color:#9f3047;
}

#nextButton{
  margin-top:5px;
  padding:7px;
}

.score{
  font-size:44px;
  font-weight:900;
  margin:5px;
}

.finishButtons{
  display:flex;
  gap:5px;
  margin-top:6px;
}

.finishButtons button{
  flex:1;
}

.footer{
  text-align:center;
  color:#8795a7;
  font-size:10px;
  margin-top:3px;
}


/* MENŠIE OBRAZOVKY */

@media(max-height:700px){

  .wrap{
    padding:4px;
  }

  .logo{
    font-size:25px;
  }

  .slogan{
    font-size:9px;
    margin:1px 0 3px;
  }

  .card{
    padding:7px;
  }

  button{
    padding:6px;
    font-size:12px;
  }

  .levels{
    gap:4px;
    margin:5px 0;
  }

  .instruction{
    font-size:12px;
    margin-top:3px;
  }

  .question{
    font-size:21px;
    margin:4px 0;
  }

  .answer{
    padding:6px;
    font-size:12px;
  }

  .feedback{
    font-size:11px;
    padding:4px;
  }

  .progress{
    margin:3px 0;
  }
}


/* MOBIL */

@media(max-width:520px){

  .wrap{
    padding:4px;
  }

  .card{
    padding:8px;
  }

  .logo{
    font-size:27px;
  }

  .question{
    font-size:21px;
  }

  .answers{
    grid-template-columns:1fr;
  }

  .navButtons button{
    font-size:10px;
    padding:5px;
  }

  .badge{
    font-size:10px;
    padding:5px 7px;
  }
}
</style>
</head>

<body>

<div class="wrap">

<div class="logo">
  Dám<span>To!</span>
</div>

<div class="slogan">
  Každý deň o level vyššie.
</div>


<!-- =========================
     ÚVOD
========================= -->

<section id="home" class="card center">

  <div style="font-size:34px">
    ❓
  </div>

  <h1 style="margin:4px 0">
    Druhy viet
  </h1>

  <p style="margin:3px 0">
    Znamienka na konci viet a druhy viet.
  </p>

  <div class="levels">

    <button
      class="level active"
      data-level="1">
      ⭐ Skúšam
      <br>
      <small>
        Vyber správne znamienko
      </small>
    </button>

    <button
      class="level"
      data-level="2">
      ⭐⭐ Už mi to ide
      <br>
      <small>
        Urči druh vety
      </small>
    </button>

    <button
      class="level"
      data-level="3">
      ⭐⭐⭐ DámTo!

      <small>
        Vyber správne napísanú vetu
      </small>
    </button>

  </div>

  <button
    id="startBtn"

  </button>

  </button>

    id="allExercisesHomeBtn"
    class="allExercises allExercisesHome">
    🏠 Všetky cvičenia

</section>


<!-- =========================
     HRA
========================= -->

<section id="game" class="card hidden">

  <div class="top">

    <div class="navButtons">

      <button
        id="backBtn"
        class="secondary">
        ← Späť
      </button>

      <button
        id="allExercisesBtn"
        class="allExercises">
        🏠 Všetky cvičenia
      </button>

    </div>

    <div
      id="levelBadge"
      class="badge">
    </div>

  </div>

  <div class="progress">
    <div
      id="bar"
      class="bar">
    </div>
  </div>

  <div class="stats">

    <span id="counter"></span>

    <span>
      🏆
      <span id="points">0</span>
    </span>

  </div>

  <div
    id="instruction"
    class="instruction">
  </div>

  <div
    id="question"
    class="question">
  </div>

  <div
    id="answers"
    class="answers">
  </div>

  <div id="feedback"></div>

  <button
    id="nextButton"
    class="primary hidden">
    Ďalej ➜
  </button>

</section>


<!-- =========================
     KONIEC
========================= -->

<section
  id="finish"
  class="card center hidden">

  <div style="font-size:44px">
    🏆
  </div>

  <h1 style="margin:5px">
    Tréning hotový!
  </h1>

  <div
    id="finalScore"
    class="score">
  </div>

  <p id="finalMessage"></p>

  <button
    id="againBtn"
    class="primary">
    🔄 Nový náhodný mix
  </button>

  <div class="finishButtons">

    <button
      id="homeBtn"
      class="secondary">
      ⭐ Vybrať level
    </button>

    <button
      id="allExercisesFinishBtn"
      class="allExercises">
      🏠 Všetky cvičenia
    </button>

  </div>

</section>


<div class="footer">
  DámTo! • Druhy viet
</div>

</div>


<script>

/* =====================================================
   VŠETKY CVIČENIA
===================================================== */

const ALL_EXERCISES_URL =
"https://sites.google.com/view/vyssilevel/d%C3%A1mto-online-cvi%C4%8Denia";

function goToAllExercises(){

  window.top.location.href=
    ALL_EXERCISES_URL;
}


/* =====================================================
   VEĽKÁ DATABÁZA VIET
===================================================== */

const sentenceBank=[


/* OZNAMOVACIE */

["Dnes svieti slnko","oznamovacia","."],
["Mama varí obed","oznamovacia","."],
["Peter číta knihu","oznamovacia","."],
["Mačka spí na gauči","oznamovacia","."],
["V záhrade kvitnú tulipány","oznamovacia","."],
["Autobus prišiel načas","oznamovacia","."],
["Na stole leží zošit","oznamovacia","."],
["Deti sa hrajú na ihrisku","oznamovacia","."],
["Ráno sme išli do školy","oznamovacia","."],
["V lese rastú huby","oznamovacia","."],
["Môj brat hrá futbal","oznamovacia","."],
["Na oblohe letí lietadlo","oznamovacia","."],


/* OPYTOVACIE */

["Kde býva tvoja stará mama","opytovacia","?"],
["Koľko máš rokov","opytovacia","?"],
["Kedy pôjdeme domov","opytovacia","?"],
["Máš rád zmrzlinu","opytovacia","?"],
["Čo dnes čítate","opytovacia","?"],
["Prečo prší","opytovacia","?"],
["Kto zaklopal na dvere","opytovacia","?"],
["Kam ide tento autobus","opytovacia","?"],
["Ako sa volá tvoj pes","opytovacia","?"],
["Ktorú farbu máš najradšej","opytovacia","?"],
["Kde je moja ceruzka","opytovacia","?"],
["Pôjdeš sa so mnou hrať","opytovacia","?"],


/* ROZKAZOVACIE */

["Otvor si zošit","rozkazovacia","!"],
["Sadni si na svoje miesto","rozkazovacia","!"],
["Zatvor dvere","rozkazovacia","!"],
["Prines mi, prosím, pohár vody","rozkazovacia","!"],
["Poď sem","rozkazovacia","!"],
["Umy si ruky","rozkazovacia","!"],
["Prečítaj prvú vetu","rozkazovacia","!"],
["Napíš svoje meno","rozkazovacia","!"],
["Počkaj chvíľu","rozkazovacia","!"],
["Dávaj pozor na cestu","rozkazovacia","!"],
["Prosím, podaj mi knihu","rozkazovacia","!"],
["Nezabudni si tašku","rozkazovacia","!"],


/* ŽELACIE */

["Kiež by už prišlo leto","želacia","!"],
["Nech sa ti darí","želacia","!"],
["Keby tak dnes nasnežilo","želacia","!"],
["Nech máš krásny deň","želacia","!"],
["Kiež by sme vyhrali zápas","želacia","!"],
["Nech sa rýchlo uzdravíš","želacia","!"],
["Keby som mal nové korčule","želacia","!"],
["Nech sa nám výlet vydarí","želacia","!"],
["Kiež by som našiel stratenú hračku","želacia","!"],
["Nech sú všetci zdraví","želacia","!"],
["Keby tak prázdniny trvali dlhšie","želacia","!"],
["Kiež by zajtra svietilo slnko","želacia","!"]

];


/* =====================================================
   LEVEL 1
   ZNAMIENKA
===================================================== */

const level1=
sentenceBank.map(
  (item,index)=>({

    id:
      "l1-"+index,

    i:
      "Ktoré znamienko patrí na koniec vety?",

    q:
      item[0],

    c:
      item[2],

    o:[
      ".",
      "?",
      "!"
    ]

  })
);


/* =====================================================
   LEVEL 2
   DRUH VETY
===================================================== */

const level2=
sentenceBank.map(
  (item,index)=>({

    id:
      "l2-"+index,

    i:
      "Aký je to druh vety?",

    q:
      item[0]+item[2],

    c:
      item[1],

    o:[
      "oznamovacia",
      "opytovacia",
      "rozkazovacia",
      "želacia"
    ]

  })
);


/* =====================================================
   LEVEL 3
   SPRÁVNE NAPÍSANÁ VETA
===================================================== */

const correctSentences=[

"Dnes ideme do kina.",
"Kde je moja kniha?",
"Otvor okno!",
"Nech sa ti darí!",
"Mačka sedí pri okne.",
"Ako sa voláš?",
"Prines si učebnicu!",
"Kiež by už bolo leto!",
"Na dvore rastie strom.",
"Kam ideš?",
"Uprac si izbu!",
"Nech sa nám výlet vydarí!",
"V triede je ticho.",
"Prečo meškáš?",
"Počkaj na mňa!",
"Keby tak dnes nasnežilo!",
"Otec číta noviny.",
"Kto je dnes služba?",
"Zapíš si domácu úlohu!",
"Kiež by sme vyhrali!",
"Na stole je váza.",
"Kedy príde vlak?",
"Dávaj pozor!",
"Nech máš pekný deň!",
"Vonku fúka vietor.",
"Máš hotovú úlohu?",
"Zober si dáždnik!",
"Keby som mal viac času!",
"Pes spí v búde.",
"Ako sa máš?",
"Prečítaj nahlas!",
"Nech sú všetci zdraví!"

];


function lowerFirst(sentence){

  return sentence
    .charAt(0)
    .toLowerCase()
    +
    sentence.slice(1);
}


function wrongPunctuation(sentence){

  const last=
    sentence.slice(-1);

  const base=
    sentence.slice(0,-1);

  if(last==="."){
    return base+"?";
  }

  return base+".";
}


const level3=
correctSentences.map(
  (sentence,index)=>({

    id:
      "l3-"+(index+1),

    i:
      "Vyber správne napísanú vetu.",

    q:
      "",

    c:
      sentence,

    o:[
      wrongPunctuation(sentence),
      lowerFirst(sentence),
      sentence
    ]

  })
);


/* =====================================================
   PREMENNÉ
===================================================== */

let selectedLevel=1;
let questions=[];
let current=0;
let score=0;
let locked=false;
let selectedAnswerIndex=0;

const $=
  id=>document.getElementById(id);


/* =====================================================
   NÁHODNÉ PORADIE
===================================================== */

function shuffle(array){

  const a=[...array];

  for(
    let i=a.length-1;
    i>0;
    i--
  ){

    const j=
      Math.floor(
        Math.random()*(i+1)
      );

    [
      a[i],
      a[j]
    ]=[
      a[j],
      a[i]
    ];
  }

  return a;
}


/* =====================================================
   ZDROJ PODĽA LEVELU
===================================================== */

function source(){

  if(selectedLevel===1){
    return level1;
  }

  if(selectedLevel===2){
    return level2;
  }

  return level3;
}


/* =====================================================
   OBRAZOVKY
===================================================== */

function show(id){

  [
    "home",
    "game",
    "finish"
  ]
  .forEach(
    name=>
      $(name)
      .classList
      .add("hidden")
  );

  $(id)
  .classList
  .remove("hidden");

  window.scrollTo(0,0);
}


/* =====================================================
   CHYBY
===================================================== */

function getMistakes(){

  try{

    return JSON.parse(
      localStorage.getItem(
        "damtoDruhyVietV1"
      ) || "{}"
    );

  }
  catch(error){

    return {};
  }
}


function setMistakes(data){

  localStorage.setItem(
    "damtoDruhyVietV1",
    JSON.stringify(data)
  );

  updateMistakeCount();
}


function updateMistakeCount(){

  const count=
    Object.keys(
      getMistakes()
    ).length;

  $("mistakeCount")
  .textContent=
    count
    ? " ("+count+")"
    : "";
}


/* =====================================================
   VÝBER LEVELU
===================================================== */

document
.querySelectorAll(".level")
.forEach(
  button=>{

    button.addEventListener(
      "click",
      ()=>{

        selectedLevel=
          Number(
            button.dataset.level
          );

        document
        .querySelectorAll(".level")
        .forEach(
          item=>
            item.classList
            .remove("active")
        );

        button
        .classList
        .add("active");
      }
    );
  }
);


/* =====================================================
   TLAČIDLÁ
===================================================== */

$("startBtn")
.addEventListener(
  "click",
  startTraining
);

$("mistakesBtn")
.addEventListener(
  "click",
  startMistakeTraining
);

$("backBtn")
.addEventListener(
  "click",
  ()=>show("home")
);

$("homeBtn")
.addEventListener(
  "click",
  ()=>show("home")
);

$("againBtn")
.addEventListener(
  "click",
  startTraining
);

$("nextButton")
.addEventListener(
  "click",
  nextQuestion
);


/* VŠETKY CVIČENIA */

$("allExercisesHomeBtn")
.addEventListener(
  "click",
  goToAllExercises
);

$("allExercisesBtn")
.addEventListener(
  "click",
  goToAllExercises
);

$("allExercisesFinishBtn")
.addEventListener(
  "click",
  goToAllExercises
);


/* =====================================================
   ZAČAŤ TRÉNING
===================================================== */

function startTraining(){

  const mistakes=
    getMistakes();

  const list=
    source();

  questions=[

    ...shuffle(
      list.filter(
        x=>mistakes[x.id]
      )
    ),

    ...shuffle(
      list.filter(
        x=>!mistakes[x.id]
      )
    )

  ]
  .slice(
    0,
    10
  );

  current=0;
  score=0;

  show("game");

  render();
}


/* =====================================================
   PRECVIČIŤ CHYBY
===================================================== */

function startMistakeTraining(){

  const mistakes=
    getMistakes();

  const all=[

    ...level1,
    ...level2,
    ...level3

  ]
  .filter(
    x=>mistakes[x.id]
  );

  if(!all.length){

    alert(
      "🎉 Nemáš žiadne chyby na precvičenie."
    );

    return;
  }

  questions=
    shuffle(all)
    .slice(
      0,
      10
    );

  current=0;
  score=0;

  show("game");

  render();
}


/* =====================================================
   ZOBRAZENIE OTÁZKY
===================================================== */

function render(){

  locked=false;
  selectedAnswerIndex=0;

  if(
    current>=
    questions.length
  ){

    finish();

    return;
  }

  const x=
    questions[current];

  $("counter")
  .textContent=
    (current+1)+
    " / "+
    questions.length;

  $("points")
  .textContent=
    score;

  $("bar")
  .style.width=
    (
      current/
      questions.length*
      100
    )+
    "%";

  $("levelBadge")
  .textContent=

    selectedLevel===1
    ? "⭐ Skúšam"

    : selectedLevel===2
    ? "⭐⭐ Už mi to ide"

    : "⭐⭐⭐ DámTo!";

  $("instruction")
  .textContent=
    x.i;

  $("question")
  .textContent=
    x.q || "";

  $("feedback")
  .innerHTML="";

  $("feedback")
  .className="";

  $("nextButton")
  .classList
  .add("hidden");

  const box=
    $("answers");

  box.innerHTML="";

  const mixed=
    shuffle(
      x.o
    );

  mixed.forEach(
    (option,index)=>{

      const button=
        document
        .createElement(
          "button"
        );

      button.className=
        "answer";

      button.textContent=
        option;

      button.addEventListener(
        "click",
        ()=>{

          selectedAnswerIndex=
            index;

          updateKeyboardSelection();

          checkAnswer(
            option===x.c
          );
        }
      );

      box.appendChild(
        button
      );
    }
  );

  updateKeyboardSelection();
}


/* =====================================================
   KLÁVESNICOVÝ VÝBER
===================================================== */

function updateKeyboardSelection(){

  const buttons=[
    ...document
    .querySelectorAll(
      ".answer"
    )
  ];

  buttons.forEach(
    (button,index)=>{

      button
      .classList
      .toggle(

        "keyboardSelected",

        index===
        selectedAnswerIndex &&
        !button.disabled
      );
    }
  );
}


/* =====================================================
   KONTROLA ODPOVEDE
===================================================== */

function checkAnswer(ok){

  if(locked){
    return;
  }

  locked=true;

  const x=
    questions[current];

  const mistakes=
    getMistakes();

  const feedback=
    $("feedback");

  if(ok){

    score++;

    delete mistakes[x.id];

    feedback.className=
      "feedback good";

    feedback.innerHTML=
      "🎉 <b>Výborne!</b> Správna odpoveď.";

  }
  else{

    mistakes[x.id]=true;

    feedback.className=
      "feedback bad";

    feedback.innerHTML=
      "❌ <b>Nesprávne.</b> Správna odpoveď je <b>"+
      x.c+
      "</b>.";
  }

  setMistakes(
    mistakes
  );

  $("points")
  .textContent=
    score;

  document
  .querySelectorAll(
    ".answer"
  )
  .forEach(
    button=>
      button.disabled=true
  );

  $("nextButton")
  .classList
  .remove("hidden");
}


/* =====================================================
   ĎALŠIA OTÁZKA
===================================================== */

function nextQuestion(){

  current++;

  render();

  window.scrollTo(
    0,
    0
  );
}


/* =====================================================
   ŠÍPKY + ENTER
===================================================== */

document
.addEventListener(
  "keydown",
  event=>{

    if(
      $("game")
      .classList
      .contains("hidden")
    ){
      return;
    }

    const buttons=[
      ...document
      .querySelectorAll(
        ".answer"
      )
    ];


    /* po odpovedi ENTER = ďalšia otázka */

    if(
      locked &&
      event.key==="Enter"
    ){

      event.preventDefault();

      nextQuestion();

      return;
    }


    if(
      locked ||
      !buttons.length
    ){
      return;
    }


    /* doprava / dole */

    if(
      event.key==="ArrowRight" ||
      event.key==="ArrowDown"
    ){

      event.preventDefault();

      selectedAnswerIndex=
        (
          selectedAnswerIndex+1
        ) %
        buttons.length;

      updateKeyboardSelection();

      return;
    }


    /* doľava / hore */

    if(
      event.key==="ArrowLeft" ||
      event.key==="ArrowUp"
    ){

      event.preventDefault();

      selectedAnswerIndex=
        (
          selectedAnswerIndex-1+
          buttons.length
        ) %
        buttons.length;

      updateKeyboardSelection();

      return;
    }


    /* ENTER = potvrdenie */

    if(
      event.key==="Enter"
    ){

      event.preventDefault();

      const selected=
        buttons[
          selectedAnswerIndex
        ];

      if(
        selected &&
        !selected.disabled
      ){

        selected.click();
      }
    }
  }
);


/* =====================================================
   KONIEC
===================================================== */

function finish(){

  $("finalScore")
  .textContent=
    score+
    " / "+
    questions.length;

  const percent=
    questions.length
    ? score/questions.length
    : 0;

  $("finalMessage")
  .textContent=

    percent===1
    ? "Perfektné! Bez chyby. 🌟"

    : percent>=0.8
    ? "Výborne! 🚀"

    : percent>=0.6
    ? "Pekná práca. 💪"

    : "Skús ešte jeden tréning. 🌱";

  updateMistakeCount();

  show(
    "finish"
  );
}


/* =====================================================
   SPUSTENIE
===================================================== */

updateMistakeCount();

</script>
